# Pipeline D — DAKE + MobileNetV3-Large
# DAKE lọc candidates, MobileNet encode (thay vì BEiT-3).
# Nhanh nhất, ít VRAM nhất — dùng để đánh giá Accuracy–Latency trade-off.

keyframe:
  pipeline: dake_mobilenet

  mobilenet:
    device: cuda
    batch_size: 64

  semantic:
    similarity_threshold: 0.90

  dake:
    enabled: true
    candidate_ratio: 0.02
    window_size: 3
