# Pipeline C — DAKE + BEiT-3 (Pipeline đề xuất chính)
# DAKE lọc candidate frames trước, BEiT-3 encode candidates,
# SemanticFilter chọn keyframe cuối cùng.
# Cân bằng tốt giữa chất lượng và tốc độ.

keyframe:
  pipeline: dake_beit3

  beit3:
    checkpoint_path: checkpoint/beit-3/beit3_large_patch16_224.pth
    spm_path: checkpoint/beit-3/beit3.spm
    device: cuda
    batch_size: 32

  semantic:
    similarity_threshold: 0.90

  dake:
    enabled: true
    candidate_ratio: 0.02    # Giữ 2% frame làm candidate (benchmark: 0.01~0.20)
    window_size: 3            # Sliding window size
