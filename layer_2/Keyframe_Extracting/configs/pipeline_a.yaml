# Pipeline A — Semantic Only (BEiT-3)
# Encode toàn bộ frame bằng BEiT-3, không dùng DAKE pre-filter.
# Chất lượng cao nhất, chậm nhất.

keyframe:
  pipeline: beit3

  beit3:
    checkpoint_path: checkpoint/beit-3/beit3_large_patch16_224.pth
    spm_path: checkpoint/beit-3/beit3.spm
    device: cuda        # "cpu" nếu không có GPU
    batch_size: 32

  semantic:
    similarity_threshold: 0.90   # Giữ frame nếu cosine sim < threshold

  dake:
    enabled: false
