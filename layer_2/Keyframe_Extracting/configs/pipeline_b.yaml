# Pipeline B — Semantic Only (MobileNetV3-Large)
# Encode toàn bộ frame bằng MobileNet, không dùng DAKE.
# Nhanh hơn A ~8x, ít VRAM hơn, không cần checkpoint thủ công.

keyframe:
  pipeline: mobilenet

  mobilenet:
    device: cuda        # "cpu" nếu không có GPU
    batch_size: 64

  semantic:
    similarity_threshold: 0.90

  dake:
    enabled: false
