# -----------------------------------------------------------------------------
# Object Detection Pipeline Configuration
# Uses YOLO (ultralytics) -- any YOLOv8/v9/v10/v11 model is supported.
# Same input/skip format as the OCR pipeline.
# -----------------------------------------------------------------------------

# Path to the folder containing input video frames
input_dir: "./frames"

# Path for the resulting JSON file
output_file: "./detections.json"

# -----------------------------------------------------------------------------
# Hardware-saving: Frame Skip Strategies
# Same skip heuristics as the OCR pipeline.
# Order: stride -> blank -> blur -> pHash similarity
# -----------------------------------------------------------------------------
skip:
  stride: 1
  blank_brightness_threshold: 15
  blur_threshold: 50.0
  similarity_hamming_threshold: 8

# -----------------------------------------------------------------------------
# YOLO Detection Engine Settings
# -----------------------------------------------------------------------------
detection:
  # Model path -- change this one value to swap models.
  # Ultralytics auto-downloads official models on first use.
  #
  # YOLOv8 trained on Open Images V7 (600 classes, auto-download):
  #   yolov8n-oiv7.pt   -> nano    (fastest,  lowest accuracy)
  #   yolov8s-oiv7.pt   -> small
  #   yolov8m-oiv7.pt   -> medium
  #   yolov8l-oiv7.pt   -> large
  #   yolov8x-oiv7.pt   -> xlarge  (slowest,  highest accuracy)
  #
  # Custom model:
  #   "./my_model.pt"  -> path to your trained checkpoint
  model_path: "yolov8x-oiv7.pt"

  # GPU acceleration
  use_gpu: true

  # Half precision (FP16) -- faster on NVIDIA GPUs, ignored on CPU
  half: true

  # Input image size (pixels, square).
  # Higher = more accurate but slower and more VRAM.
  # 640 is the YOLO default and works well for most use cases.
  imgsz: 640

  # Minimum confidence threshold to keep a detection (0.0 - 1.0)
  confidence_threshold: 0.25

  # IoU threshold for Non-Maximum Suppression (NMS)
  # Lower = fewer overlapping boxes; higher = more permissive
  iou_threshold: 0.45

  # Maximum number of detections per frame
  max_det: 300

  # Filter to specific Open Images V7 class IDs (null = detect all 600 classes)
  # Example: [0] = only detect the first class
  # Full Open Images V7 class list: https://docs.ultralytics.com/datasets/detect/open-images-v7/
  classes: null
